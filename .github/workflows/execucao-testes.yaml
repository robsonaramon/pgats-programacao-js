name: 'Execução dos testes'

on:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: 'Clonando código do repositório'
        uses: actions/checkout@v4
      - name: 'Instalando Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: 'Instalando Yarn'
        run: npm install -g yarn

      - name: 'Instalando dependências do projeto'
        run: yarn install
      - name: Executando testes
        run: yarn run tests
      
      - name: Executando testes do trabalho final de JS
        run: yarn run finalTests